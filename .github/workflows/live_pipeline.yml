name: Prekick Live Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prekick-live-pipeline
  cancel-in-progress: false

jobs:
  live-pipeline:
    runs-on: ubuntu-latest

    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Prekick
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run live pipeline
        run: python scripts/run_live_pipeline.py

      - name: Run tests
        run: pytest

      - name: Commit updated live data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/fixtures/completed_matches_2026_27.csv \
            data/fixtures/upcoming_fixtures.csv \
            predictions/ledger.csv

          if git diff --cached --quiet; then
            echo "No live-data changes to commit."
          else
            git commit -m "Update Prekick live data"
            git push
          fi
